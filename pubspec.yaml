name: wingapro
description: "Winga Pro, the ultimate bundle seller in Tanzania"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.1.0
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  provider: ^6.1.1
  app_links: ^7.1.2
  intl: ^0.20.3
  uuid: ^4.0.0
  smooth_page_indicator: ^2.0.1
  http_parser: ^4.1.2

  connectivity_plus: ^7.3.1
  image_picker: ^1.1.0
  image_cropper: ^12.2.1
  flutter_local_notifications: ^22.3.0
  permission_handler: ^13.0.1
  url_launcher: ^6.2.6
  encrypt: ^5.0.3
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  shimmer: ^3.0.0





dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/wingaproicon.png"
  adaptive_icon_background: "#0A2E5C"
  adaptive_icon_foreground: "assets/images/wingaproicon.png"

  dependency_overrides:
    web: ^1.0.0